name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build the release exe
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the GNU Rust toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV

      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build the release exe
        run: cargo build --release --locked

      - name: Upload the unsigned exe
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-unsigned
          path: target/release/Spectrum.exe
          if-no-files-found: error

  sign:
    name: Sign with SignPath
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      signed: ${{ steps.token.outputs.present }}
    steps:
      - name: Check for the SignPath token
        id: token
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SIGNPATH_API_TOKEN is not set. Skipping signing."
          fi

      - name: Submit the signing request
        if: steps.token.outputs.present == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload the signed exe
        if: steps.token.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-signed
          path: signed
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: [build, sign]
    if: >-
      always()
      && needs.build.result == 'success'
      && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the signed exe
        if: needs.sign.outputs.signed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Spectrum-signed
          path: dist

      - name: Download the unsigned exe
        if: needs.sign.outputs.signed != 'true'
        uses: actions/download-artifact@v4
        with:
          name: Spectrum-unsigned
          path: dist

      - name: Collect the exe and write release notes
        env:
          SIGNED: ${{ needs.sign.outputs.signed }}
        run: |
          exe=$(find dist -type f -name Spectrum.exe | head -n 1)
          if [ -z "$exe" ]; then
            echo "::error::Spectrum.exe not found in the downloaded artifact."
            exit 1
          fi
          mkdir -p release
          cp "$exe" release/Spectrum.exe
          (cd release && sha256sum Spectrum.exe > Spectrum.exe.sha256)
          {
            echo "The SHA-256 of Spectrum.exe is in Spectrum.exe.sha256."
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "This build is unsigned. Windows SmartScreen may warn when you run it."
            fi
          } > notes.md
          cat release/Spectrum.exe.sha256

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          files: |
            release/Spectrum.exe
            release/Spectrum.exe.sha256
