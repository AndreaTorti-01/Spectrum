name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Order: build Spectrum.exe, sign it, build SpectrumSetup.exe around the signed exe, sign that, publish both.
# Both signing jobs are skipped when the SignPath variables are absent, and the release goes out unsigned.

jobs:
  build:
    name: Build the release exe
    runs-on: windows-latest
    outputs:
      exe-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the GNU Rust toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV

      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build the release exe
        run: cargo build --release --locked

      - name: Upload the unsigned exe
        id: upload-exe
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-unsigned
          path: target/release/Spectrum.exe
          if-no-files-found: error

      - name: Upload the installer icon
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-icon
          path: target/spectrum.ico
          if-no-files-found: error

  sign-exe:
    name: Sign Spectrum.exe with SignPath
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      signed: ${{ steps.token.outputs.present }}
    steps:
      - name: Check for the SignPath token
        id: token
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SIGNPATH_API_TOKEN is not set. Skipping signing."
          fi

      - name: Submit the signing request
        if: steps.token.outputs.present == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_CONFIG_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.exe-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload the signed exe
        if: steps.token.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-signed
          path: signed
          if-no-files-found: error

  installer:
    name: Build SpectrumSetup.exe
    needs: [build, sign-exe]
    if: >-
      always()
      && needs.build.result == 'success'
      && (needs.sign-exe.result == 'success' || needs.sign-exe.result == 'skipped')
    runs-on: windows-latest
    outputs:
      installer-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download the signed exe
        if: needs.sign-exe.outputs.signed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Spectrum-signed
          path: exe

      - name: Download the unsigned exe
        if: needs.sign-exe.outputs.signed != 'true'
        uses: actions/download-artifact@v4
        with:
          name: Spectrum-unsigned
          path: exe

      - name: Download the installer icon
        uses: actions/download-artifact@v4
        with:
          name: Spectrum-icon
          path: target

      - name: Build the installer
        shell: pwsh
        run: |
          $exe = (Get-ChildItem exe -Recurse -Filter Spectrum.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw "Spectrum.exe not found in the downloaded artifact." }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          }
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          }
          & $iscc "/DAppVersion=$version" "/DExePath=$exe" installer\spectrum.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed with exit code $LASTEXITCODE" }

      - name: Upload the unsigned installer
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: SpectrumSetup-unsigned
          path: target/installer/SpectrumSetup.exe
          if-no-files-found: error

  sign-installer:
    name: Sign SpectrumSetup.exe with SignPath
    needs: installer
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      signed: ${{ steps.token.outputs.present }}
    steps:
      - name: Check for the SignPath token
        id: token
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SIGNPATH_API_TOKEN is not set. Skipping signing."
          fi

      - name: Submit the signing request
        if: steps.token.outputs.present == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIG_SLUG }}
          github-artifact-id: ${{ needs.installer.outputs.installer-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload the signed installer
        if: steps.token.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SpectrumSetup-signed
          path: signed
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: [build, sign-exe, installer, sign-installer]
    if: >-
      always()
      && needs.build.result == 'success'
      && needs.installer.result == 'success'
      && (needs.sign-exe.result == 'success' || needs.sign-exe.result == 'skipped')
      && (needs.sign-installer.result == 'success' || needs.sign-installer.result == 'skipped')
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the signed exe
        if: needs.sign-exe.outputs.signed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Spectrum-signed
          path: dist/exe

      - name: Download the unsigned exe
        if: needs.sign-exe.outputs.signed != 'true'
        uses: actions/download-artifact@v4
        with:
          name: Spectrum-unsigned
          path: dist/exe

      - name: Download the signed installer
        if: needs.sign-installer.outputs.signed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: SpectrumSetup-signed
          path: dist/setup

      - name: Download the unsigned installer
        if: needs.sign-installer.outputs.signed != 'true'
        uses: actions/download-artifact@v4
        with:
          name: SpectrumSetup-unsigned
          path: dist/setup

      - name: Collect the files and write release notes
        env:
          EXE_SIGNED: ${{ needs.sign-exe.outputs.signed }}
          SETUP_SIGNED: ${{ needs.sign-installer.outputs.signed }}
        run: |
          exe=$(find dist/exe -type f -name Spectrum.exe | head -n 1)
          setup=$(find dist/setup -type f -name SpectrumSetup.exe | head -n 1)
          if [ -z "$exe" ] || [ -z "$setup" ]; then
            echo "::error::Spectrum.exe or SpectrumSetup.exe not found in the downloaded artifacts."
            exit 1
          fi
          mkdir -p release
          cp "$exe" release/Spectrum.exe
          cp "$setup" release/SpectrumSetup.exe
          (cd release && sha256sum SpectrumSetup.exe Spectrum.exe > SHA256SUMS.txt)
          {
            echo "SpectrumSetup.exe installs Spectrum for the current user, no admin needed. Spectrum.exe is the portable copy."
            echo "SHA-256 checksums are in SHA256SUMS.txt."
            if [ "$EXE_SIGNED" != "true" ] || [ "$SETUP_SIGNED" != "true" ]; then
              echo
              echo "This build is unsigned. Windows SmartScreen may warn when you run it."
            fi
          } > notes.md
          cat release/SHA256SUMS.txt

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          files: |
            release/SpectrumSetup.exe
            release/Spectrum.exe
            release/SHA256SUMS.txt
