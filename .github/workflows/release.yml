name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Builds the MSIX package for the Partner Center upload (the Store signs it) and, on a tag, writes a GitHub
# release with the notes and a link to the Store. The release has no binaries and is not marked latest, so
# the frozen 0.1 line's releases/latest/download/SpectrumSetup.exe keeps working. A manual run only builds.

jobs:
  package:
    name: Build the MSIX package
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the GNU Rust toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV

      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build the MSIX package
        shell: pwsh
        run: ./packaging/build-msix.ps1

      - name: Upload the MSIX package and the Store tile
        uses: actions/upload-artifact@v4
        with:
          name: Spectrum-msix
          path: |
            target/Spectrum-*.msix
            target/store-tile.png
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write the release notes
        run: |
          echo "Get Spectrum from the Microsoft Store: https://andreatorti-01.github.io/Spectrum/" > notes.md

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          make_latest: false
